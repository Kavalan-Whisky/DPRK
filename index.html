<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love DPRK!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f0f0f;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #8da459; /* Matching the green accent from your previous theme */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #a8c46b;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <button onclick="window.location.href='https://www.youtube.com/watch?v=H3ynKWEboA8'">Click me or gay.</button>

</body>
</html>
